<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>SkyRent - Login & Registration</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    font-family: Arial, sans-serif;

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 20% 10%,
            #ffffff 0%,
            transparent 25%
        ),

        linear-gradient(
            135deg,
            #062b78,
            #0074d9 50%,
            #7ed8ff
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* =========================
   CLOUD EFFECT
========================= */

body::before,
body::after {

    content: "";

    position: fixed;

    width: 300px;

    height: 150px;

    background:
        rgba(255,255,255,0.25);

    border-radius: 50%;

    filter: blur(25px);

    z-index: -1;

}

body::before {

    top: 5%;

    left: -80px;

}

body::after {

    bottom: 5%;

    right: -80px;

}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    width: 100%;

    max-width: 950px;

    min-height: 600px;

    display: flex;

    background:
        rgba(255,255,255,0.97);

    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 25px 60px
        rgba(0,0,0,0.3);

}


/* =========================
   LEFT SIDE
========================= */

.left {

    width: 45%;

    background:

        linear-gradient(
            rgba(0,50,130,0.55),
            rgba(0,110,210,0.7)
        ),

        url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1000&q=80");

    background-size: cover;

    background-position: center;

    color: white;

    padding: 50px 35px;

    display: flex;

    flex-direction: column;

    justify-content: center;

}

.logo {

    font-size: 38px;

    font-weight: 900;

    margin-bottom: 10px;

}

.logo span {

    color: #68d5ff;

}

.tagline {

    letter-spacing: 4px;

    font-size: 12px;

    margin-bottom: 40px;

}

.left h1 {

    font-size: 42px;

    line-height: 1.05;

    margin-bottom: 20px;

}

.left h1 span {

    color: #ffd33d;

}

.left p {

    font-size: 16px;

    line-height: 1.7;

}

.features {

    margin-top: 35px;

}

.features div {

    margin: 12px 0;

    font-weight: bold;

    font-size: 15px;

}


/* =========================
   RIGHT SIDE
========================= */

.right {

    width: 55%;

    padding: 45px 55px;

    display: flex;

    flex-direction: column;

    justify-content: center;

}

.form-title {

    text-align: center;

    margin-bottom: 25px;

}

.form-title h2 {

    color: #062b78;

    font-size: 32px;

}

.form-title p {

    color: #777;

    margin-top: 7px;

}


/* =========================
   TABS
========================= */

.tabs {

    display: flex;

    background: #edf5ff;

    border-radius: 12px;

    padding: 5px;

    margin-bottom: 25px;

}

.tab {

    flex: 1;

    border: none;

    background: transparent;

    padding: 13px;

    border-radius: 9px;

    font-weight: bold;

    color: #14509b;

    cursor: pointer;

    font-size: 15px;

}

.tab.active {

    background: #0752a5;

    color: white;

}


/* =========================
   FORMS
========================= */

.form {

    display: none;

}

.form.active {

    display: block;

}


/* =========================
   INPUT
========================= */

.input-box {

    margin-bottom: 17px;

}

.input-box label {

    display: block;

    color: #183c70;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 7px;

}

.input-box input {

    width: 100%;

    padding: 14px 15px;

    border: 2px solid #dce7f5;

    border-radius: 11px;

    outline: none;

    font-size: 15px;

    transition: 0.3s;

}

.input-box input:focus {

    border-color: #0874db;

    box-shadow:
        0 0 0 3px
        rgba(8,116,219,0.1);

}


/* =========================
   PHONE
========================= */

.phone-input {

    display: flex;

    gap: 8px;

}

.country-code {

    width: 75px !important;

    background: #f1f6fc;

    text-align: center;

    font-weight: bold;

}


/* =========================
   PASSWORD
========================= */

.password-wrap {

    position: relative;

}

.password-wrap input {

    padding-right: 50px;

}

.eye {

    position: absolute;

    right: 15px;

    top: 14px;

    cursor: pointer;

    color: #1559a5;

}


/* =========================
   BUTTON
========================= */

.btn {

    width: 100%;

    border: none;

    padding: 15px;

    border-radius: 12px;

    background:

        linear-gradient(
            135deg,
            #06499b,
            #0789e8
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;

    box-shadow:
        0 7px 18px
        rgba(0,90,180,0.25);

    transition: 0.2s;

}

.btn:hover {

    transform: translateY(-2px);

}

.gold-btn {

    background:

        linear-gradient(
            135deg,
            #e9aa00,
            #ffd83d
        );

    color: #072d70;

}


/* =========================
   MESSAGE
========================= */

.message {

    display: none;

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 10px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

}

.message.success {

    display: block;

    background: #dff8e7;

    color: #17733c;

}

.message.error {

    display: block;

    background: #ffe1e1;

    color: #a51e1e;

}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    margin-top: 25px;

    font-size: 12px;

    color: #888;

}

.footer strong {

    color: #0755a8;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 750px) {

    body {

        padding: 12px;

    }

    .container {

        flex-direction: column;

        min-height: auto;

        border-radius: 20px;

    }

    .left {

        width: 100%;

        min-height: 280px;

        padding: 35px 25px;

        text-align: center;

    }

    .logo {

        font-size: 32px;

    }

    .left h1 {

        font-size: 32px;

    }

    .features {

        display: flex;

        justify-content: center;

        gap: 12px;

        flex-wrap: wrap;

        margin-top: 20px;

    }

    .features div {

        font-size: 12px;

        margin: 3px;

    }

    .right {

        width: 100%;

        padding: 30px 22px;

    }

    .form-title h2 {

        font-size: 27px;

    }

}

</style>

</head>

<div class="container">


<!-- =================================================

================================================== -->

    <div class="tagline">

    <!-- PHONE -->

    <div class="input-box">

<script>


/* =====================================================
   IMPORTANT USER DATABASE
===================================================== */


/*
    skyrentUsers
    =============
    Stores EVERY registered user.

    skyrentUser
    ===========
    Stores ONLY the currently logged-in user.


    REFERRAL SYSTEM
    ===============

    referralCode
        = This user's OWN referral code.

    referredByCode
        = Referral code entered when registering.

    referredByPhone
        = Phone number of the person who referred them.

    firstPurchaseCompleted
        = Becomes TRUE after the member's first purchase.

    referralCommissionGenerated
        = Becomes TRUE after referral commission
          has been generated for the first purchase.


    IMPORTANT:

    Only the FIRST purchase is eligible for
    referral commission.

    Later purchases are NOT eligible.
*/


/* =====================================================
   REFERRAL COMMISSION RATES
===================================================== */

const REFERRAL_RATES = {

    A: 0.25,

    B: 0.03,

    C: 0.01

};


/* =====================================================
   REGISTRATION BONUS
===================================================== */

const REGISTRATION_BONUS = 50;


/* =====================================================
   GET ALL USERS
===================================================== */

function getAllUsers() {

    const savedUsers =
        localStorage.getItem(
            "skyrentUsers"
        );

    if (!savedUsers) {

        return [];

    }

    try {

        const users =
            JSON.parse(savedUsers);

        if (Array.isArray(users)) {

            return users;

        }

        return [];

    } catch (error) {

        console.error(
            "Invalid users database:",
            error
        );

        return [];

    }

}


/* =====================================================
   SAVE ALL USERS
===================================================== */

function saveAllUsers(users) {

    localStorage.setItem(

        "skyrentUsers",

        JSON.stringify(users)

    );

}


/* =====================================================
   NORMALIZE REFERRAL CODE
===================================================== */

function normalizeReferralCode(code) {

    return String(code || "")

        .trim()

        .toUpperCase()

        .replace(/\s+/g, "");

}


/* =====================================================
   GENERATE RANDOM REFERRAL CODE
===================================================== */

function generateReferralCode() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "SKY";

    for (let i = 0; i < 6; i++) {

        code +=

            characters.charAt(

                Math.floor(

                    Math.random() *
                    characters.length

                )

            );

    }

    return code;

}


/* =====================================================
   CREATE UNIQUE REFERRAL CODE
===================================================== */

function createUniqueReferralCode(users) {

    let code = "";

    let exists = true;

    let attempts = 0;

    while (
        exists &&
        attempts < 100
    ) {

        code =
            generateReferralCode();

        exists =
            users.some(

                function(user) {

                    return (

                        user &&

                        normalizeReferralCode(

                            user.referralCode

                        ) === code

                    );

                }

            );

        attempts++;

    }

    if (exists) {

        code =
            "SKY" +

            Date.now()
                .toString()
                .slice(-8);

    }

    return code;

}


/* =====================================================
   FIND USER BY REFERRAL CODE
===================================================== */

function findUserByReferralCode(
    code,
    users
) {

    const normalizedCode =
        normalizeReferralCode(code);

    if (!normalizedCode) {

        return null;

    }

    return (

        users.find(

            function(user) {

                return (

                    user &&

                    normalizeReferralCode(

                        user.referralCode

                    ) === normalizedCode

                );

            }

        ) || null

    );

}


/* =====================================================
   FIND USER BY PHONE
===================================================== */

function findUserByPhone(
    phone,
    users
) {

    return (

        users.find(

            function(user) {

                return (

                    user &&

                    String(user.phone) ===
                    String(phone)

                );

            }

        ) || null

    );

}


/* =====================================================
   GET REFERRAL CHAIN
===================================================== */

function getReferralChain(
    user,
    users
) {

    const chain = [];

    if (
        !user ||
        !user.phone
    ) {

        return chain;

    }


    let currentPhone =
        user.referredByPhone || "";


    const visited =
        new Set();


    const levels = [
        "A",
        "B",
        "C"
    ];


    for (
        let i = 0;
        i < levels.length;
        i++
    ) {

        if (!currentPhone) {

            break;

        }


        if (
            visited.has(
                String(currentPhone)
            )
        ) {

            break;

        }


        visited.add(
            String(currentPhone)
        );


        const referrer =
            findUserByPhone(
                currentPhone,
                users
            );


        if (!referrer) {

            break;

        }


        chain.push({

            level:
                levels[i],

            phone:
                String(
                    referrer.phone
                ),

            name:
                referrer.name ||
                "User",

            referralCode:
                referrer.referralCode ||
                "",

            rate:
                REFERRAL_RATES[
                    levels[i]
                ]

        });


        currentPhone =
            referrer.referredByPhone ||
            "";

    }


    return chain;

}


/* =====================================================
   PREPARE USER REFERRAL DATA
===================================================== */

function prepareUserReferralData(
    user,
    users
) {

    if (!user) {

        return user;

    }


    /* OWN REFERRAL CODE */

    if (
        !normalizeReferralCode(
            user.referralCode
        )
    ) {

        user.referralCode =
            createUniqueReferralCode(
                users
            );

    }


    user.referralCode =
        normalizeReferralCode(
            user.referralCode
        );


    /* FIRST PURCHASE STATUS */

    if (
        typeof user.firstPurchaseCompleted !==
        "boolean"
    ) {

        user.firstPurchaseCompleted =
            false;

    }


    /* COMMISSION STATUS */

    if (
        typeof user.referralCommissionGenerated !==
        "boolean"
    ) {

        user.referralCommissionGenerated =
            false;

    }


    /* PURCHASE COUNT */

    if (
        typeof user.purchaseCount !==
        "number"
    ) {

        user.purchaseCount = 0;

    }


    /* REFERRAL FIELDS */

    if (
        user.referredByCode ===
        undefined
    ) {

        user.referredByCode = "";

    }


    if (
        user.referredByPhone ===
        undefined
    ) {

        user.referredByPhone = "";

    }


    return user;

}


/* =====================================================
   UPDATE EXISTING USERS
===================================================== */

function updateExistingReferralData() {

    let users =
        getAllUsers();

    if (!users.length) {

        return;

    }


    let changed = false;


    users.forEach(

        function(user) {

            if (!user) {

                return;

            }


            const beforeCode =
                normalizeReferralCode(
                    user.referralCode
                );


            const beforeFirst =
                user.firstPurchaseCompleted;


            const beforeCommission =
                user.referralCommissionGenerated;


            const beforePurchaseCount =
                user.purchaseCount;


            prepareUserReferralData(
                user,
                users
            );


            if (
                beforeCode !==
                user.referralCode
            ) {

                changed = true;

            }


            if (
                beforeFirst !==
                user.firstPurchaseCompleted
            ) {

                changed = true;

            }


            if (
                beforeCommission !==
                user.referralCommissionGenerated
            ) {

                changed = true;

            }


            if (
                beforePurchaseCount !==
                user.purchaseCount
            ) {

                changed = true;

            }

        }

    );


    if (changed) {

        saveAllUsers(users);

    }

}

function loginUser(email, password){

    let users = JSON.parse(
        localStorage.getItem("skyrentUsers")
    ) || [];

    let user = users.find(
        u => u.email === email && u.password === password
    );

    if(user){

        // Save current logged-in user
        localStorage.setItem(
            "skyrentUser",
            JSON.stringify(user)
        );

        // Go to dashboard
        window.location.href = "dashboard.html";

    }else{

        alert("Invalid email or password");

    }

}



    
/* =====================================================
   MIGRATE OLD ACCOUNT
===================================================== */

function migrateOldUser() {

    const usersDatabase =
        localStorage.getItem(
            "skyrentUsers"
        );


    if (usersDatabase) {

        return;

    }


    const oldUserData =
        localStorage.getItem(
            "skyrentUser"
        );


    if (!oldUserData) {

        return;

    }


    try {

        const oldUser =
            JSON.parse(
                oldUserData
            );


        if (
            oldUser &&
            oldUser.phone
        ) {

            const users = [];


            const migratedUser = {

                name:
                    oldUser.name ||
                    "SkyRent User",

                phone:
                    oldUser.phone,

                password:
                    oldUser.password ||
                    "",

                referralCode:
                    normalizeReferralCode(
                        oldUser.referralCode
                    ),

                referredByCode:
                    oldUser.referredByCode ||
                    "",

                referredByPhone:
                    oldUser.referredByPhone ||
                    "",

                firstPurchaseCompleted:
                    oldUser.firstPurchaseCompleted ===
                    true,

                referralCommissionGenerated:
                    oldUser.referralCommissionGenerated ===
                    true,

                purchaseCount:
                    Number(
                        oldUser.purchaseCount
                    ) || 0,

                registrationBonusGiven:
                    false

            };


            prepareUserReferralData(
                migratedUser,
                users
            );


            users.push(
                migratedUser
            );


            prepareUserReferralData(
                migratedUser,
                users
            );


            saveAllUsers(
                users
            );


            localStorage.setItem(

                "skyrentUser",

                JSON.stringify(
                    migratedUser
                )

            );


            console.log(
                "Old SkyRent account migrated successfully."
            );

        }

    } catch (error) {

        console.error(
            "Could not migrate old user:",
            error
        );

    }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    document
        .getElementById("loginForm")
        .classList.add("active");


    document
        .getElementById("registerForm")
        .classList.remove("active");


    document
        .querySelectorAll(".tab")[0]
        .classList.add("active");


    document
        .querySelectorAll(".tab")[1]
        .classList.remove("active");


    document
        .getElementById("title")
        .innerText =
        "Welcome Back";


    document
        .getElementById("subtitle")
        .innerText =
        "Login to your SkyRent account";


    clearMessage();

}


/* =====================================================
   SHOW REGISTER
===================================================== */

function showRegister() {

    document
        .getElementById("loginForm")
        .classList.remove("active");


    document
        .getElementById("registerForm")
        .classList.add("active");


    document
        .querySelectorAll(".tab")[0]
        .classList.remove("active");


    document
        .querySelectorAll(".tab")[1]
        .classList.add("active");


    document
        .getElementById("title")
        .innerText =
        "Join SkyRent";


    document
        .getElementById("subtitle")
        .innerText =
        "Create your account today";


    clearMessage();

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(
    id,
    element
) {

    const input =
        document.getElementById(id);


    if (
        input.type === "password"
    ) {

        input.type = "text";

        element.innerText =
            "🙈";

    } else {

        input.type =
            "password";

        element.innerText =
            "👁";

    }

}


/* =====================================================
   REGISTER NEW USER
===================================================== */

function register(event) {

    event.preventDefault();


    /* =========================
       GET FORM VALUES
    ========================= */

    const name =
        document
        .getElementById("regName")
        .value
        .trim();


    const phone =
        document
        .getElementById("regPhone")
        .value
        .trim();


    const password =
        document
        .getElementById("regPassword")
        .value;


    const confirm =
        document
        .getElementById("confirmPassword")
        .value;


    const referralCodeInput =
        document
        .getElementById("referralCode")
        .value
        .trim();


    const normalizedReferralCode =
        normalizeReferralCode(
            referralCodeInput
        );


    /* =========================
       NAME CHECK
    ========================= */

    if (
        name.length < 2
    ) {

        showMessage(
            "Please enter your full name.",
            "error"
        );

        return;

    }


    /* =========================
       PHONE CHECK
    ========================= */

    if (
        !/^9\d{9}$/.test(phone)
    ) {

        showMessage(
            "Please enter a valid Philippine mobile number.",
            "error"
        );

        return;

    }


    /* =========================
       PASSWORD CHECK
    ========================= */

    if (
        password.length < 6
    ) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    /* =========================
       CONFIRM PASSWORD
    ========================= */

    if (
        password !== confirm
    ) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    /* =========================
       GET ALL USERS
    ========================= */

    let users =
        getAllUsers();


    /* =========================
       DUPLICATE PHONE CHECK
    ========================= */

    const alreadyRegistered =
        users.some(

            function(user) {

                return (

                    user &&

                    String(user.phone) ===
                    String(phone)

                );

            }

        );


    if (alreadyRegistered) {

        showMessage(
            "This phone number is already registered.",
            "error"
        );

        return;

    }


    /* =================================================
       FIND REFERRER
    ================================================= */

    let referrer = null;


    if (
        normalizedReferralCode
    ) {

        referrer =
            findUserByReferralCode(
                normalizedReferralCode,
                users
            );


        if (!referrer) {

            showMessage(
                "Invalid referral code. Please check the code and try again.",
                "error"
            );

            return;

        }


        if (
            String(referrer.phone) ===
            String(phone)
        ) {

            showMessage(
                "You cannot use your own referral code.",
                "error"
            );

            return;

        }

    }


    /* =================================================
       REGISTRATION BONUS
    ================================================= */

    const registrationBonus =
        REGISTRATION_BONUS;


    /*
       IMPORTANT:

       Capture the registration time ONCE.

       This exact timestamp is used for:

       1. User registration
       2. Bonus Reward
       3. Earnings History
    */

    const registrationTime =
        new Date().toISOString();


    /* =================================================
       CREATE UNIQUE OWN REFERRAL CODE
    ================================================= */

    const ownReferralCode =
        createUniqueReferralCode(
            users
        );


    /* =================================================
       CREATE NEW USER
    ================================================= */

    const newUser = {

        name:
            name,

        phone:
            phone,

        password:
            password,


        referralCode:
            ownReferralCode,


        referredByCode:
            referrer
                ? normalizeReferralCode(
                    referrer.referralCode
                )
                : "",


        referredByPhone:
            referrer
                ? String(
                    referrer.phone
                )
                : "",


        firstPurchaseCompleted:
            false,


        referralCommissionGenerated:
            false,


        purchaseCount:
            0,


        /*
           Registration bonus has been
           created for this account.
        */

        registrationBonusGiven:
            true,

        registrationBonusAmount:
            registrationBonus,

        /*
           Save the exact registration time.
        */

        registrationDate:
            registrationTime

    };


    /* =================================================
       ADD USER TO DATABASE
    ================================================= */

    users.push(
        newUser
    );


    /* =================================================
       SAVE ALL USERS
    ================================================= */

    saveAllUsers(
        users
    );


    /* =================================================
       INITIAL USER BALANCE
    ================================================= */

    const balanceKey =
        "balance_" +
        phone;


    /*
       New accounts start with
       the ₱50 registration bonus.
    */

    if (
        localStorage.getItem(
            balanceKey
        ) === null
    ) {

        localStorage.setItem(

            balanceKey,

            registrationBonus.toFixed(2)

        );

    }


    /* =================================================
       INITIAL USER EARNINGS
    ================================================= */

    const earningsKey =
        "earnings_" +
        phone;


    if (
        localStorage.getItem(
            earningsKey
        ) === null
    ) {

        localStorage.setItem(

            earningsKey,

            "0"

        );

    }


    /* =================================================
       SAVE BONUS RECORD
    ================================================= */

    const bonusKey =
        "registrationBonus_" +
        phone;


    /*
       This protects the bonus record
       from being recreated.
    */

    if (
        localStorage.getItem(
            bonusKey
        ) === null
    ) {

        const bonusRecord = {

            id:
                "bonus_" +
                phone,

            phone:
                phone,

            amount:
                registrationBonus,

            type:
                "bonus",

            typeName:
                "Bonus Reward",

            label:
                "Registration Bonus",

            status:
                "credited",

            date:
                registrationTime,

            timestamp:
                registrationTime

        };


        localStorage.setItem(

            bonusKey,

            JSON.stringify(
                bonusRecord
            )

        );

    }


    /* =================================================
       SAVE BONUS INTO EARNINGS HISTORY
    =================================================

       THIS IS THE IMPORTANT NEW PART.

       earnings.html reads:

           earningsHistory_<phone>

       Therefore the ₱50 bonus must also
       be stored there.

       The same registrationTime is used,
       so the displayed time is exactly
       the registration time.
    ================================================= */

    const earningsHistoryKey =
        "earningsHistory_" +
        phone;


    let earningsHistory = [];


    try {

        earningsHistory =
            JSON.parse(

                localStorage.getItem(
                    earningsHistoryKey
                )

            ) || [];


        if (
            !Array.isArray(
                earningsHistory
            )
        ) {

            earningsHistory = [];

        }

    } catch (error) {

        earningsHistory = [];

    }


    /*
       Check whether this exact
       registration bonus already exists.
    */

    const bonusAlreadyInHistory =
        earningsHistory.some(

            function(record) {

                if (!record) {

                    return false;

                }


                return (

                    String(
                        record.type || ""
                    )
                    .toLowerCase()
                    === "bonus"

                    &&

                    String(
                        record.phone || ""
                    )
                    === String(phone)

                );

            }

        );


    /*
       Only add the bonus once.
    */

    if (
        !bonusAlreadyInHistory
    ) {

        const bonusHistoryRecord = {

            id:
                "bonus_" +
                phone,

            type:
                "bonus",

            typeName:
                "Bonus Reward",

            label:
                "Registration Bonus",

            amount:
                registrationBonus,

            phone:
                phone,

            timestamp:
                registrationTime,

            date:
                registrationTime

        };


        earningsHistory.push(
            bonusHistoryRecord
        );


        localStorage.setItem(

            earningsHistoryKey,

            JSON.stringify(
                earningsHistory
            )

        );

    }


    /* =================================================
       REFERRAL REGISTRATION RECORD
    ================================================= */

    /*
        This record is useful for the
        Network page.

        It does NOT create a commission.

        Commission is only created when
        the new member completes their
        FIRST purchase.
    */

    if (referrer) {

        const referralRegistrationKey =
            "referralRegistration_" +
            phone;


        const referralRegistration = {

            memberPhone:
                phone,

            memberName:
                name,

            referrerPhone:
                String(
                    referrer.phone
                ),

            referrerName:
                referrer.name ||
                "User",

            referralCode:
                normalizedReferralCode,

            date:
                registrationTime,

            firstPurchaseCompleted:
                false,

            commissionGenerated:
                false

        };


        localStorage.setItem(

            referralRegistrationKey,

            JSON.stringify(
                referralRegistration
            )

        );

    }


    /* =================================================
       SUCCESS MESSAGE
    ================================================= */

    let successMessage =

        "Registration successful! " +

        "₱50 registration bonus added to your balance.";


    if (referrer) {

        successMessage +=

            " Referred by " +

            (
                referrer.name ||
                "your sponsor"
            ) +

            ".";

    }


    showMessage(
        successMessage,
        "success"
    );


    /* =================================================
       CLEAR FORM
    ================================================= */

    document
        .getElementById("registerForm")
        .reset();


    /* =================================================
       RETURN TO LOGIN
    ================================================= */

    setTimeout(

        function() {

            document
                .getElementById("loginPhone")
                .value =
                phone;


            showLogin();

        },

        1800

    );

}


/* =====================================================
   LOGIN
===================================================== */

function login(event) {

    event.preventDefault();


    /* =========================
       GET LOGIN VALUES
    ========================= */

    const phone =
        document
        .getElementById("loginPhone")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    /* =========================
       PHONE CHECK
    ========================= */

    if (
        !/^9\d{9}$/.test(phone)
    ) {

        showMessage(
            "Please enter a valid Philippine mobile number.",
            "error"
        );

        return;

    }


    /* =========================
       GET ALL REGISTERED USERS
    ========================= */

    let users =
        getAllUsers();


    /* =================================================
       UPDATE OLD USER REFERRAL DATA
    ================================================= */

    let usersChanged = false;


    users.forEach(

        function(account) {

            if (!account) {

                return;

            }


            const oldCode =
                account.referralCode;


            prepareUserReferralData(
                account,
                users
            );


            if (
                oldCode !==
                account.referralCode
            ) {

                usersChanged = true;

            }

        }

    );


    if (usersChanged) {

        saveAllUsers(
            users
        );

    }


    /* =========================
       FIND USER
    ========================= */

    const user =
        users.find(

            function(account) {

                return (

                    account &&

                    String(account.phone) ===
                    String(phone)

                );

            }

        );


    /* =========================
       NO USER
    ========================= */

    if (!user) {

        showMessage(
            "No account found with this phone number.",
            "error"
        );

        return;

    }


    /* =========================
       PASSWORD CHECK
    ========================= */

    if (
        String(user.password) !==
        String(password)
    ) {

        showMessage(
            "Incorrect phone number or password.",
            "error"
        );

        return;

    }


    /* =================================================
       MAKE SURE CURRENT USER HAS
       REFERRAL DATA
    ================================================= */

    prepareUserReferralData(
        user,
        users
    );


    saveAllUsers(
        users
    );


    /* =================================================
       LOGIN SUCCESS
    ================================================= */

    localStorage.setItem(

        "skyrentUser",

        JSON.stringify(
            user
        )

    );


    /* =========================
       SAVE USERNAME
    ========================= */

    localStorage.setItem(

        "username",

        user.name

    );


    /* =========================
       SUCCESS MESSAGE
    ========================= */

    showMessage(
        "Login successful! Welcome ✈",
        "success"
    );


    /* =========================
       OPEN DASHBOARD
    ========================= */

    setTimeout(

        function() {

            window.location.href =
                "dashboard.html";

        },

        500

    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " +
        type;

}


/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage() {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        "";


    message.className =
        "message";

}


/* =====================================================
   INITIALIZE USER DATABASE
===================================================== */

migrateOldUser();


updateExistingReferralData();


</script>


<a
    id="dashboardLink"
    href="dashboard.html"
    style="display:none;">

    Go Dashboard

</a>
