<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyRent - Login & Registration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;min-height:100vh;
  background:radial-gradient(circle at 20% 10%,#fff 0%,transparent 25%),
  linear-gradient(135deg,#062b78,#0074d9 50%,#7ed8ff);
  display:flex;justify-content:center;align-items:center;padding:20px;
}
body::before,body::after{
  content:"";position:fixed;width:300px;height:150px;
  background:rgba(255,255,255,.25);border-radius:50%;filter:blur(25px);z-index:-1
}
body::before{top:5%;left:-80px}body::after{bottom:5%;right:-80px}
.container{
  width:100%;max-width:950px;min-height:600px;display:flex;
  background:rgba(255,255,255,.97);border-radius:28px;overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,.3)
}
.left{
  width:45%;background:linear-gradient(rgba(0,50,130,.55),rgba(0,110,210,.7)),
  url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1000&q=80");
  background-size:cover;background-position:center;color:#fff;padding:50px 35px;
  display:flex;flex-direction:column;justify-content:center
}
.logo{font-size:38px;font-weight:900;margin-bottom:10px}.logo span{color:#68d5ff}
.tagline{letter-spacing:4px;font-size:12px;margin-bottom:40px}
.left h1{font-size:42px;line-height:1.05;margin-bottom:20px}.left h1 span{color:#ffd33d}
.left p{font-size:16px;line-height:1.7}.features{margin-top:35px}
.features div{margin:12px 0;font-weight:bold;font-size:15px}
.right{width:55%;padding:45px 55px;display:flex;flex-direction:column;justify-content:center}
.form-title{text-align:center;margin-bottom:25px}.form-title h2{color:#062b78;font-size:32px}
.form-title p{color:#777;margin-top:7px}
.tabs{display:flex;background:#edf5ff;border-radius:12px;padding:5px;margin-bottom:25px}
.tab{flex:1;border:0;background:transparent;padding:13px;border-radius:9px;font-weight:bold;
color:#14509b;cursor:pointer;font-size:15px}.tab.active{background:#0752a5;color:#fff}
.form{display:none}.form.active{display:block}
.input-box{margin-bottom:17px}.input-box label{display:block;color:#183c70;font-size:14px;
font-weight:bold;margin-bottom:7px}.input-box input{width:100%;padding:14px 15px;
border:2px solid #dce7f5;border-radius:11px;outline:0;font-size:15px;transition:.3s}
.input-box input:focus{border-color:#0874db;box-shadow:0 0 0 3px rgba(8,116,219,.1)}
.phone-input{display:flex;gap:8px}.country-code{width:75px!important;background:#f1f6fc;text-align:center;font-weight:bold}
.password-wrap{position:relative}.password-wrap input{padding-right:50px}
.eye{position:absolute;right:15px;top:14px;cursor:pointer;color:#1559a5;user-select:none}
.btn{width:100%;border:0;padding:15px;border-radius:12px;background:linear-gradient(135deg,#06499b,#0789e8);
color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:5px;
box-shadow:0 7px 18px rgba(0,90,180,.25);transition:.2s}.btn:hover{transform:translateY(-2px)}
.gold-btn{background:linear-gradient(135deg,#e9aa00,#ffd83d);color:#072d70}
.message{display:none;padding:12px;margin-bottom:15px;border-radius:10px;text-align:center;font-size:14px;font-weight:bold}
.message.success{display:block;background:#dff8e7;color:#17733c}
.message.error{display:block;background:#ffe1e1;color:#a51e1e}
.footer{text-align:center;margin-top:25px;font-size:12px;color:#888}.footer strong{color:#0755a8}
.hidden-link{display:none}
@media(max-width:750px){
  body{padding:12px}.container{flex-direction:column;min-height:auto;border-radius:20px}
  .left{width:100%;min-height:280px;padding:35px 25px;text-align:center}
  .logo{font-size:32px}.left h1{font-size:32px}.features{display:flex;justify-content:center;
  gap:12px;flex-wrap:wrap;margin-top:20px}.features div{font-size:12px;margin:3px}
  .right{width:100%;padding:30px 22px}.form-title h2{font-size:27px}
}
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <div class="logo">✈ Sky<span>Rent</span></div>
    <div class="tagline">DREAM • SAVE • FLY • EARN</div>
    <h1>Invest Today,<br><span>Fly Tomorrow</span></h1>
    <p>Turn your savings into real opportunities. Choose your craft and start your journey with SkyRent.</p>
    <div class="features"><div>✓ Save</div><div>✓ Invest</div><div>✓ Earn</div><div>✓ Fly</div></div>
  </div>

  <div class="right">
    <div class="form-title">
      <h2 id="title">Welcome Back</h2>
      <p id="subtitle">Login to your SkyRent account</p>
    </div>

    <div class="tabs">
      <button class="tab active" type="button" onclick="showLogin()">LOGIN</button>
      <button class="tab" type="button" onclick="showRegister()">REGISTER</button>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm" class="form active" onsubmit="login(event)">
      <div class="input-box">
        <label for="loginPhone">Phone Number</label>
        <div class="phone-input">
          <input class="country-code" type="text" value="+63" readonly>
          <input type="tel" id="loginPhone" placeholder="9XXXXXXXXX" maxlength="10" inputmode="numeric" required>
        </div>
      </div>
      <div class="input-box">
        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
          <span class="eye" onclick="togglePassword('loginPassword',this)">👁</span>
        </div>
      </div>
      <button class="btn" type="submit">✈ LOGIN</button>
    </form>

    <form id="registerForm" class="form" onsubmit="register(event)">
      <div class="input-box">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="Enter your full name" required>
      </div>
      <div class="input-box">
        <label for="regPhone">Phone Number</label>
        <div class="phone-input">
          <input class="country-code" type="text" value="+63" readonly>
          <input type="tel" id="regPhone" placeholder="9XXXXXXXXX" maxlength="10" inputmode="numeric" required>
        </div>
      </div>
      <div class="input-box">
        <label for="regPassword">Password</label>
        <div class="password-wrap">
          <input type="password" id="regPassword" placeholder="Create a password" required>
          <span class="eye" onclick="togglePassword('regPassword',this)">👁</span>
        </div>
      </div>
      <div class="input-box">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
          <span class="eye" onclick="togglePassword('confirmPassword',this)">👁</span>
        </div>
      </div>
      <div class="input-box">
        <label for="referralCode">Referral Code</label>
        <input type="text" id="referralCode" placeholder="Enter referral code (optional)" maxlength="30">
      </div>
      <button class="btn gold-btn" type="submit">✈ CREATE ACCOUNT</button>
    </form>

    <div class="footer"><strong>SkyRent</strong> © 2026<br>Dream • Save • Fly • Earn</div>
  </div>
</div>

<a id="dashboardLink" class="hidden-link" href="dashboard.html">Go Dashboard</a>

<script>
const REFERRAL_RATES = { A: 0.25, B: 0.03, C: 0.01 };
const REGISTRATION_BONUS = 50;

function getAllUsers(){
  const savedUsers=localStorage.getItem("skyrentUsers");
  if(!savedUsers)return [];
  try{
    const users=JSON.parse(savedUsers);
    return Array.isArray(users)?users:[];
  }catch(error){
    console.error("Invalid users database:",error);
    return [];
  }
}

function saveAllUsers(users){
  localStorage.setItem("skyrentUsers",JSON.stringify(users));
}

function normalizeReferralCode(code){
  return String(code||"").trim().toUpperCase().replace(/\s+/g,"");
}

function generateReferralCode(){
  const characters="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="SKY";
  for(let i=0;i<6;i++){
    code+=characters.charAt(Math.floor(Math.random()*characters.length));
  }
  return code;
}

function createUniqueReferralCode(users){
  let code="",exists=true,attempts=0;
  while(exists&&attempts<100){
    code=generateReferralCode();
    exists=users.some(user=>user&&normalizeReferralCode(user.referralCode)===code);
    attempts++;
  }
  return exists?"SKY"+Date.now().toString().slice(-8):code;
}

function findUserByReferralCode(code,users){
  const normalizedCode=normalizeReferralCode(code);
  if(!normalizedCode)return null;
  return users.find(user=>user&&normalizeReferralCode(user.referralCode)===normalizedCode)||null;
}

function findUserByPhone(phone,users){
  return users.find(user=>user&&String(user.phone)===String(phone))||null;
}

function getReferralChain(user,users){
  const chain=[];
  if(!user||!user.phone)return chain;
  let currentPhone=user.referredByPhone||"";
  const visited=new Set();
  const levels=["A","B","C"];
  for(let i=0;i<levels.length;i++){
    if(!currentPhone||visited.has(String(currentPhone)))break;
    visited.add(String(currentPhone));
    const referrer=findUserByPhone(currentPhone,users);
    if(!referrer)break;
    chain.push({
      level:levels[i],phone:String(referrer.phone),name:referrer.name||"User",
      referralCode:referrer.referralCode||"",rate:REFERRAL_RATES[levels[i]]
    });
    currentPhone=referrer.referredByPhone||"";
  }
  return chain;
}

function prepareUserReferralData(user,users){
  if(!user)return user;
  if(!normalizeReferralCode(user.referralCode)){
    user.referralCode=createUniqueReferralCode(users);
  }
  user.referralCode=normalizeReferralCode(user.referralCode);
  if(typeof user.firstPurchaseCompleted!=="boolean")user.firstPurchaseCompleted=false;
  if(typeof user.referralCommissionGenerated!=="boolean")user.referralCommissionGenerated=false;
  if(typeof user.purchaseCount!=="number")user.purchaseCount=0;
  if(user.referredByCode===undefined)user.referredByCode="";
  if(user.referredByPhone===undefined)user.referredByPhone="";
  return user;
}

function updateExistingReferralData(){
  let users=getAllUsers();
  if(!users.length)return;
  let changed=false;
  users.forEach(user=>{
    if(!user)return;
    const before=JSON.stringify({
      referralCode:user.referralCode,
      firstPurchaseCompleted:user.firstPurchaseCompleted,
      referralCommissionGenerated:user.referralCommissionGenerated,
      purchaseCount:user.purchaseCount
    });
    prepareUserReferralData(user,users);
    const after=JSON.stringify({
      referralCode:user.referralCode,
      firstPurchaseCompleted:user.firstPurchaseCompleted,
      referralCommissionGenerated:user.referralCommissionGenerated,
      purchaseCount:user.purchaseCount
    });
    if(before!==after)changed=true;
  });
  if(changed)saveAllUsers(users);
}

function migrateOldUser(){
  if(localStorage.getItem("skyrentUsers"))return;
  const oldUserData=localStorage.getItem("skyrentUser");
  if(!oldUserData)return;
  try{
    const oldUser=JSON.parse(oldUserData);
    if(oldUser&&oldUser.phone){
      const users=[];
      const migratedUser={
        name:oldUser.name||"SkyRent User",phone:oldUser.phone,password:oldUser.password||"",
        referralCode:normalizeReferralCode(oldUser.referralCode),
        referredByCode:oldUser.referredByCode||"",referredByPhone:oldUser.referredByPhone||"",
        firstPurchaseCompleted:oldUser.firstPurchaseCompleted===true,
        referralCommissionGenerated:oldUser.referralCommissionGenerated===true,
        purchaseCount:Number(oldUser.purchaseCount)||0,registrationBonusGiven:false
      };
      prepareUserReferralData(migratedUser,users);
      users.push(migratedUser);
      saveAllUsers(users);
      localStorage.setItem("skyrentUser",JSON.stringify(migratedUser));
    }
  }catch(error){console.error("Could not migrate old user:",error);}
}

function showLogin(){
  document.getElementById("loginForm").classList.add("active");
  document.getElementById("registerForm").classList.remove("active");
  document.querySelectorAll(".tab")[0].classList.add("active");
  document.querySelectorAll(".tab")[1].classList.remove("active");
  document.getElementById("title").innerText="Welcome Back";
  document.getElementById("subtitle").innerText="Login to your SkyRent account";
  clearMessage();
}

function showRegister(){
  document.getElementById("loginForm").classList.remove("active");
  document.getElementById("registerForm").classList.add("active");
  document.querySelectorAll(".tab")[0].classList.remove("active");
  document.querySelectorAll(".tab")[1].classList.add("active");
  document.getElementById("title").innerText="Join SkyRent";
  document.getElementById("subtitle").innerText="Create your account today";
  clearMessage();
}

function togglePassword(id,element){
  const input=document.getElementById(id);
  if(input.type==="password"){input.type="text";element.innerText="🙈";}
  else{input.type="password";element.innerText="👁";}
}

function register(event){
  event.preventDefault();

  const name=document.getElementById("regName").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  const password=document.getElementById("regPassword").value;
  const confirm=document.getElementById("confirmPassword").value;
  const normalizedReferralCode=normalizeReferralCode(document.getElementById("referralCode").value);

  if(name.length<2){showMessage("Please enter your full name.","error");return;}
  if(!/^9\d{9}$/.test(phone)){showMessage("Please enter a valid Philippine mobile number.","error");return;}
  if(password.length<6){showMessage("Password must be at least 6 characters.","error");return;}
  if(password!==confirm){showMessage("Passwords do not match.","error");return;}

  let users=getAllUsers();
  if(users.some(user=>user&&String(user.phone)===String(phone))){
    showMessage("This phone number is already registered.","error");return;
  }

  let referrer=null;
  if(normalizedReferralCode){
    referrer=findUserByReferralCode(normalizedReferralCode,users);
    if(!referrer){showMessage("Invalid referral code. Please check the code and try again.","error");return;}
    if(String(referrer.phone)===String(phone)){showMessage("You cannot use your own referral code.","error");return;}
  }

  const registrationTime=new Date().toISOString();
  const ownReferralCode=createUniqueReferralCode(users);
  const newUser={
    name,phone,password,referralCode:ownReferralCode,
    referredByCode:referrer?normalizeReferralCode(referrer.referralCode):"",
    referredByPhone:referrer?String(referrer.phone):"",
    firstPurchaseCompleted:false,referralCommissionGenerated:false,purchaseCount:0,
    registrationBonusGiven:true,registrationBonusAmount:REGISTRATION_BONUS,
    registrationDate:registrationTime
  };

  users.push(newUser);
  saveAllUsers(users);

  const balanceKey="balance_"+phone;
  if(localStorage.getItem(balanceKey)===null){
    localStorage.setItem(balanceKey,REGISTRATION_BONUS.toFixed(2));
  }

  const earningsKey="earnings_"+phone;
  if(localStorage.getItem(earningsKey)===null)localStorage.setItem(earningsKey,"0");

  const bonusKey="registrationBonus_"+phone;
  if(localStorage.getItem(bonusKey)===null){
    localStorage.setItem(bonusKey,JSON.stringify({
      id:"bonus_"+phone,phone,amount:REGISTRATION_BONUS,type:"bonus",
      typeName:"Bonus Reward",label:"Registration Bonus",status:"credited",
      date:registrationTime,timestamp:registrationTime
    }));
  }

  const earningsHistoryKey="earningsHistory_"+phone;
  let earningsHistory=[];
  try{
    earningsHistory=JSON.parse(localStorage.getItem(earningsHistoryKey))||[];
    if(!Array.isArray(earningsHistory))earningsHistory=[];
  }catch(error){earningsHistory=[];}

  const bonusAlreadyInHistory=earningsHistory.some(record=>
    record&&String(record.type||"").toLowerCase()==="bonus"&&String(record.phone||"")===String(phone)
  );

  if(!bonusAlreadyInHistory){
    earningsHistory.push({
      id:"bonus_"+phone,type:"bonus",typeName:"Bonus Reward",
      label:"Registration Bonus",amount:REGISTRATION_BONUS,phone,
      timestamp:registrationTime,date:registrationTime
    });
    localStorage.setItem(earningsHistoryKey,JSON.stringify(earningsHistory));
  }

  if(referrer){
    localStorage.setItem("referralRegistration_"+phone,JSON.stringify({
      memberPhone:phone,memberName:name,referrerPhone:String(referrer.phone),
      referrerName:referrer.name||"User",referralCode:normalizedReferralCode,
      date:registrationTime,firstPurchaseCompleted:false,commissionGenerated:false
    }));
  }

  let successMessage="Registration successful! ₱50 registration bonus added to your balance.";
  if(referrer)successMessage+=" Referred by "+(referrer.name||"your sponsor")+".";
  showMessage(successMessage,"success");
  document.getElementById("registerForm").reset();

  setTimeout(()=>{
    document.getElementById("loginPhone").value=phone;
    showLogin();
  },1800);
}

function login(event){
  event.preventDefault();
  const phone=document.getElementById("loginPhone").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!/^9\d{9}$/.test(phone)){
    showMessage("Please enter a valid Philippine mobile number.","error");return;
  }

  let users=getAllUsers();
  let usersChanged=false;

  users.forEach(account=>{
    if(!account)return;
    const oldCode=account.referralCode;
    prepareUserReferralData(account,users);
    if(oldCode!==account.referralCode)usersChanged=true;
  });
  if(usersChanged)saveAllUsers(users);

  const user=users.find(account=>account&&String(account.phone)===String(phone));
  if(!user){showMessage("No account found with this phone number.","error");return;}
  if(String(user.password)!==String(password)){
    showMessage("Incorrect phone number or password.","error");return;
  }

  prepareUserReferralData(user,users);
  saveAllUsers(users);
  localStorage.setItem("skyrentUser",JSON.stringify(user));
  localStorage.setItem("username",user.name);
  showMessage("Login successful! Welcome ✈","success");

  setTimeout(()=>{window.location.href="dashboard.html";},500);
}

function showMessage(text,type){
  const message=document.getElementById("message");
  message.innerText=text;
  message.className="message "+type;
}

function clearMessage(){
  const message=document.getElementById("message");
  message.innerText="";
  message.className="message";
}

migrateOldUser();
updateExistingReferralData();
</script>
</body>
</html>
